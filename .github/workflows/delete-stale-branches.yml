name: Delete stale branches

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'maintenance/delete-stale-branches'
    runs-on: ubuntu-slim
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete obsolete branches and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete feature/avi-infoframe-1080p60 || true
          git push origin --delete fix/sync-packaged-project || true
          git push origin --delete maintenance/delete-stale-branches || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/delete-stale-branches.yml
          git commit -m "Remove one-shot branch cleanup workflow"
          git push origin HEAD:main

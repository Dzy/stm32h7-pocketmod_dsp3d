name: Sync optimized DSP3D targets

on:
  push:
    branches:
      - main
    paths:
      - .chatgpt_sync/SYNC

permissions:
  contents: write

jobs:
  sync-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified optimized target patches
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)

          base64 -d .chatgpt_sync/patches.b64 > /tmp/patches.tar.zst
          echo "f5e09ba0131e1233191aa8d608ffcf0bc8dd34004069b13eebfd0900492131dc  /tmp/patches.tar.zst" | sha256sum -c -
          zstd -q -d /tmp/patches.tar.zst -o /tmp/patches.tar
          mkdir -p /tmp/patches
          tar -xf /tmp/patches.tar -C /tmp/patches

          test "$(git hash-object Core/Src/dsp3D.c)" = "21f24cb418519607a82f37ee1cbb3a12ddaaea20"
          test "$(git hash-object Core/Src/main.c)" = "a04707f858d1a645356798d753bfe45309e77c1c"
          test "$(git hash-object startup_stm32h743xx.s)" = "2b1034a6fb9c998c06b6ca01e09645388be58648"
          test "$(git hash-object Makefile)" = "fd1c730c468f428765c242404916a2013c812ae1"
          test "$(git hash-object STM32H743IITx_FLASH.ld)" = "d9076dafb8c55d005c5e9466e2275c4494977a04"
          test "$(git rev-parse HEAD:Core)" = "46b224bccc5a73c5474a0ab83a971548e18fe7dc"

          apply_patch () {
            local dst="$1"
            local patch="$2"
            zstd -q -d --patch-from="${dst}" "/tmp/patches/${patch}" -o "${dst}.new"
            mv "${dst}.new" "${dst}"
          }

          apply_patch Core/Src/dsp3D.c dsp3D.c.zst
          apply_patch Core/Src/main.c main.c.zst
          apply_patch startup_stm32h743xx.s startup.s.zst
          apply_patch Makefile Makefile.zst
          apply_patch STM32H743IITx_FLASH.ld linker.ld.zst

          test "$(git hash-object Core/Src/dsp3D.c)" = "6a4bb3adced5a24dad2a33a549d96213a8c45419"
          test "$(git hash-object Core/Src/main.c)" = "b9617acffd597b0dfbc7b718da8ad11c045ee46b"
          test "$(git hash-object startup_stm32h743xx.s)" = "884ba131bef4c0e46ada40b10a27db5e58d60b9f"
          test "$(git hash-object Makefile)" = "be95137c0a3c3528a4e4a751432a518178673106"
          test "$(git hash-object STM32H743IITx_FLASH.ld)" = "3bfdae2edb6d6a875760eb6cc9bd0562ee263cd9"

          git add -A Core
          ROOT_TREE="$(git write-tree)"
          CORE_TREE="$(git ls-tree "${ROOT_TREE}" Core | awk '{print $3}')"
          echo "Core tree after update: ${CORE_TREE}"
          test "${CORE_TREE}" = "2a2a82210ed1b5d72ea7356ea0285a72814955bf"

          git add Core/Src/dsp3D.c Core/Src/main.c startup_stm32h743xx.s Makefile STM32H743IITx_FLASH.ld
          git rm -f .github/workflows/chatgpt_sync_targets.yml .chatgpt_sync/patches.b64 .chatgpt_sync/SYNC

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimize DSP3D raster pipeline and renderer cycle"
          git push origin HEAD:main

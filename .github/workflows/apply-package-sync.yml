name: Apply packaged project sync

on:
  push:
    branches:
      - fix/sync-packaged-project

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@v4
        with:
          ref: fix/sync-packaged-project
          fetch-depth: 0

      - name: Apply packaged project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          part_dir = Path('.github/sync')
          encoded = ''.join(
              (part_dir / f'package-sync.part{i:02d}').read_text()
              for i in range(6)
          )
          patch = gzip.decompress(base64.b64decode(encoded))
          expected = '2f1a2154877fc11e2adcabd077490f13955936a31db763acd73019271109ca03'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch SHA-256 mismatch: {actual}')
          Path('/tmp/package-sync.patch').write_bytes(patch)
          PY

          git apply --check /tmp/package-sync.patch
          git apply --whitespace=nowarn /tmp/package-sync.patch

          rm -rf build Drivers/CMSIS/Lib/ARM Drivers/CMSIS/Lib/IAR
          rm -rf .github/sync
          rm -f .github/workflows/apply-package-sync.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync repository with packaged project"
          git push origin HEAD:fix/sync-packaged-project

# This staging workflow removes itself after applying the verified package patch.
